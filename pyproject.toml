[project]
# Distribution name: "toolgate" on PyPI is squatted (stale since 2024, PEP 541
# reclaim pending) — the import name remains `toolgate`.
name = "toolgate-io"
version = "0.4.0"
description = "Capability control plane for embedded AI agents: scoped tokens, policy enforcement, credential injection, signed audit."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Juan Martin Maglione" }]
keywords = ["ai-agents", "security", "oauth", "capability-tokens", "delegation", "audit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Framework :: FastAPI",
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "jwcrypto>=1.5.6",
    "cryptography>=43",
    "httpx>=0.27",
    "typer>=0.27.2",
    "rich>=15.0.0",
    "regex>=2026.9.3",
]

[project.optional-dependencies]
langchain = ["langchain-core>=0.3"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://maglionejm.github.io/toolgate/"
Documentation = "https://github.com/maglionejm/toolgate/blob/main/docs/README.md"
Repository = "https://github.com/maglionejm/toolgate"
Issues = "https://github.com/maglionejm/toolgate/issues"

[project.scripts]
toolgate = "toolgate.cli.main:main"
toolgate-server = "toolgate.server.main:main"
toolgate-demo = "toolgate.demo:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/toolgate"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
