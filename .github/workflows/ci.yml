name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow runs on pull_request (forks included) and only
# needs to read the repo. Overrides the broad default GITHUB_TOKEN scope.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.13"
      - run: uv sync --dev
      - run: uv run ruff check src tests
      - run: uv run pytest tests/ -q --ignore=tests/redteam

  redteam:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.13"
      - run: uv sync --dev
      # Adversarial suite: a successful attack fails the build.
      - run: uv run pytest tests/redteam -q

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tg
          POSTGRES_PASSWORD: tg
          POSTGRES_DB: toolgate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tg"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.13"
      - run: uv sync --dev --extra postgres
      # Multi-instance correctness: races, replay, revocation coherence, and
      # the full flow against a real Postgres (#16).
      - run: uv run pytest tests/test_postgres.py -q
        env:
          TOOLGATE_TEST_PG_DSN: postgresql://tg:tg@localhost:5432/toolgate

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # gitleaks scans commit history; a shallow clone can't resolve the
          # push-event range (parent of the squash commit) and exits 1.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.13"
      # Dependency vulnerability audit. Intentionally fails the build on a known
      # CVE in the resolved dependency tree.
      - run: uvx pip-audit
      # Secrets scan across the repo / PR diff. gitleaks-action reads GITHUB_TOKEN
      # from secrets, so it must be passed through explicitly.
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
